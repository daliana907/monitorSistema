name = monitorSistema
summary = Monitor del Sistema
description = """Monitor accesible de recursos para NVDA. Basado en Resource Monitor de Joseph Lee y colaboradores. Permite consultar en tiempo real el uso y temperatura de CPU, tarjeta gráfica, memoria RAM, estado de discos duros y SSD, batería del equipo y dispositivos Bluetooth, red Wi-Fi y velocidad de internet."""
author = "Daliana, based on Resource Monitor by Joseph Lee and contributors"
version = 2.5
url = https://github.com/daliana907/monitorSistema
docFileName = readme.html
minimumNVDAVersion = 2019.3
lastTestedNVDAVersion = 2026.2
updateChannel = None
changelog = """Versión 2.5:
- Los avisos automáticos de temperatura, batería, discos y Bluetooth no llegaban a saltar nunca. Un fallo interno detenía el vigilante en su primera vuelta.
- Un procesador Intel Core i5-13600K se confundía con un AMD Ryzen 5 3600 y se anunciaba con 4,2 GHz máximos en vez de 5,0.
- La configuración no se abría desde el menú Herramientas.
- El aviso de temperatura del procesador y el de la gráfica podían quedarse con umbrales de prueba sin que nada lo indicara.
- Cuatro fallos que ocurrían en silencio ahora quedan anotados en el registro de NVDA.
- La medición del ping y las consultas al sistema podían quedarse esperando indefinidamente si el programa consultado se colgaba.
- Un mensaje aparecía dos veces en los 34 archivos de idioma, lo que impedía a las herramientas de traducción abrirlos.
- La velocidad máxima de cada procesador conocido pasa de 117 condiciones encadenadas a una tabla de datos, más fácil de ampliar.
- El escaneo de dispositivos Bluetooth, que ocupaba 382 líneas seguidas, se repartió en siete piezas con nombre propio.
- El vigilante de avisos, de 239 líneas, se repartió en cinco vigilancias independientes.
- La prueba de velocidad de internet y la consulta de salud de discos separan ahora medir de interpretar.
- La ventana de opciones, la búsqueda de conflictos y las consultas al procesador se agruparon por secciones.
- Se añadieron 30 comprobaciones automáticas que se ejecutan solas en GitHub con cada cambio.
Versión 2.4:
- Submenú en el menú Herramientas de NVDA (Monitor del Sistema) con accesos directos a la configuración y a la documentación.
- Integradas las 35 traducciones de la comunidad de Resource Monitor con reconocimiento a sus traductores originales.
- Documentación completa bilingüe (en español e inglés) y portada README en el repositorio.
- Reconocimiento formal a Joseph Lee y colaboradores en los módulos de código.
Versión 2.3:
- Alertas automáticas con sonido o voz para desconexión de Wi-Fi, batería baja de auriculares Bluetooth, temperatura de CPU/GPU y desgaste en discos SSD.
- Si pulsas dos veces un atajo de diagnóstico avanzado, el resultado se copia directamente al portapapeles sin tener que repetir la prueba.
- Detección de batería en auriculares y manos libres Bluetooth tradicionales.
- Medición de velocidad de internet con latencia, subida y bajada.
Versión 2.2:
- Mejoras en el registro de errores en nvda.log.
Versión 2.1:
- Herramienta para comprobar si algún otro complemento colisiona con estos atajos.
- Compatibilidad verificada con NVDA 2026."""
