name = monitorSistema
summary = Monitor del Sistema
description = """Monitor accesible de recursos para NVDA. Basado en Resource Monitor de Joseph Lee y colaboradores. Permite consultar en tiempo real el uso y temperatura de CPU, tarjeta gráfica, memoria RAM, estado de discos duros y SSD, batería del equipo y dispositivos Bluetooth, red Wi-Fi y velocidad de internet."""
author = "Daliana, based on Resource Monitor by Joseph Lee and contributors"
version = 2.4
url = https://github.com/daliana907/monitorSistema
docFileName = readme.html
minimumNVDAVersion = 2019.3
lastTestedNVDAVersion = 2026.2
updateChannel = None
changelog = """Versión 2.4:
- Submenú en el menú Herramientas de NVDA (Monitor del Sistema) con accesos directos a la configuración y a la documentación.
- Integradas las 35 traducciones de la comunidad de Resource Monitor con reconocimiento a sus traductores originales.
- Documentación completa bilingüe (en español e inglés) y portada README en el repositorio.
- Reconocimiento formal a Joseph Lee y colaboradores en los módulos de código.
Versión 2.3:
- Alertas automáticas con sonido o voz para desconexión de Wi-Fi, batería baja de auriculares Bluetooth, temperatura de CPU/GPU y desgaste en discos SSD.
- Si pulsas dos veces un atajo de diagnóstico avanzado, el resultado se copia directamente al portapapeles sin tener que repetir la prueba.
- Detección de batería en auriculares y manos libres Bluetooth tradicionales.
- Medición de velocidad de internet con latencia, subida y bajada.
Versión 2.2:
- Mejoras en el registro de errores en nvda.log.
Versión 2.1:
- Herramienta para comprobar si algún otro complemento colisiona con estos atajos.
- Compatibilidad verificada con NVDA 2026."""
